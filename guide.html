<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme guide｜AI memo labo</title><style>:root{--bg:#f5f5f2;--ink:#171717;--muted:#666;--line:#dddcd5;--card:#fff;--blue:#2457d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.85}.wrap{width:min(960px,calc(100% - 34px));margin:auto}header{padding:18px 0;border-bottom:1px solid var(--line)}.brand{font-weight:800;color:inherit;text-decoration:none}main{max-width:760px;padding:55px 0 80px}.k{color:var(--blue);font-weight:800;font-size:.8rem;letter-spacing:.1em}h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.08;letter-spacing:-.04em;margin:.15em 0 .35em}h2{font-size:1.6rem;margin:2.2em 0 .6em;padding-top:.55em;border-top:1px solid var(--line)}h3{margin-top:1.7em}.lead{font-size:1.08rem;color:#555}.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:24px 0}img{display:block;max-width:100%;height:auto;margin:25px auto;border-radius:14px;background:#fff}.cap{text-align:center;color:var(--muted);font-size:.8rem;margin-top:-17px}ul{padding-left:1.3em}.sources{display:grid;gap:8px}.sources a{display:block;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}.sources a:hover{border-color:#999}footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.85rem}</style></head><body><header><div class="wrap"><a class="brand" href="index.html">AI memo labo</a></div></header><div class="wrap"><main id="app"><p>読み込み中…</p></main></div><footer><div class="wrap">AI memo labo — consolidated theme guide</div></footer><script>
const D={
'29':{title:'PAS 高圧気中負荷開閉器',sub:'28本の記事から再整理',lead:'PAS本体、SOG制御装置、地絡・短絡保護、試験、接地、内蔵VT、トラブル事例までを一つの流れで整理する。',img:'https://memo-labo.com/material/pas.png',alt:'PAS 高圧気中負荷開閉器',secs:[['PASとは','PAS（Pole Air Switch）は高圧気中負荷開閉器。需要家の責任分界点付近に設置され、構内事故を切り離して波及事故を防ぐ重要な区分開閉器。定格電圧7.2kV、定格電流200A・300A・400Aなどの機種がある。'],['PAS内部と接地','負荷側にはZPD、トリップコイル、OCR接点、VT、LAなどを持つ構成がある。LA内蔵形ではPAS筐体とLAの接地を共用しA種接地を施す。接地線の太さや施工は設備仕様と規程を確認する。'],['SOG制御装置','SOGは短絡時のSO動作と地絡保護を担い、需要家側事故でPASを開放する。月次点検では電源・自己診断・V0/I0表示、外箱、内部の水滴や虫、ブッシングなどを確認する。'],['SOG試験の重要注意','試験機から補助電源を印加する前に既設P1・P2を離線する。接続したまま印加するとPAS内蔵VTを逆励磁し、高圧側に電圧が発生してVT焼損や感電につながる危険がある。試験後は配線の戻し忘れにも注意する。'],['トリップ回路','PASのVa-Vc間にはトリップコイルがあり、メーカーにより抵抗値が異なる。抵抗や絶縁抵抗に異常があると、SOGが動作してもPASを開放できない可能性がある。'],['現場トラブル','旧記事にはP1/P2誤接続、VT焼損、SOG最小動作電圧不良、接地抵抗測定時の誤動作、操作ひもの切断・植物の絡み、再投入後の再地絡などの事例がある。保護装置は「試験できた」だけでなく、実際に遮断まで成立する回路全体で確認する。']],refs:[['PAS本体','so'],['SOG制御装置','sog'],['SOG警報・自己診断','sog_keihou'],['SO動作例','so2'],['PAS内蔵VT','pasvt'],['P1P2誤操作・VT焼損','j1'],['P1P2戻し忘れ','j3'],['PAS操作ひも','pas_himo'],['波及事故例','hakyu2']]},
'19':{title:'接地・接地抵抗測定',sub:'28本の記事から再整理',lead:'A・B・C・D種接地の目的から、3電極法、2電極法、クランプ式、補助極、季節変動、現場での測定ミスまでをまとめる。',img:'https://memo-labo.com/images/setti1.svg',alt:'接地抵抗測定の原理',secs:[['接地抵抗測定の原理','接地極Eと電流極Cの間に交流電流を流し、電位極Pで電圧を測定して R=V/I から接地抵抗を求める。直流では分極や電食、異種金属による電池作用が誤差要因になるため交流を用いる。'],['A種接地','高圧機器の金属外箱などに施し、基本となる接地抵抗値は10Ω以下。キュービクル、変圧器、VCB、LBS、PASなどで重要になる。避雷器を含む場合は接地線の太さにも注意する。'],['B種接地','変圧器の高圧側と低圧側が混触した際、低圧電路の対地電圧上昇を抑えるための接地。抵抗値は系統の1線地絡電流Igに関係し、単純に「低ければ低いほど良い」とは限らない。'],['測定で起きるミス','P極を測定対象と同じ極につないで0Ωになる、C極が十分接地されず測定できない、接地端子盤で機器側と極側を取り違える、といったミスがある。補助極の配置と接続を最初に確認する。'],['クランプアーステスタ','接地線をクランプして測れるため停電や補助棒打設を省けるが、接地ループが成立していることが条件。単独接地では原理上測定できない場合がある。ノイズや断線表示も含めて判断する。'],['現場条件','屋上・地下電気室、非常用発電機運転中、共用接地、連接接地などでは測定経路が通常と異なる。季節や土壌水分でも値は変動するため、単一の数値だけでなく測定条件を記録する。']],refs:[['接地抵抗測定','setti'],['A種接地','a'],['B種接地','b'],['C種接地','c_setti'],['D種接地','ed'],['クランプアーステスタ','earth'],['D種簡易測定','kani'],['共用接地・連接接地','setti2'],['季節変動','setti_jiko']]},
'6':{title:'太陽光発電設備',sub:'30本の記事から再整理',lead:'太陽光パネル、ストリング、PCS、直流ケーブル、絶縁抵抗・耐圧試験、保護機能、遠隔監視、故障・火災までを体系的に整理する。',img:'https://memo-labo.com/images/panel1.jpg',alt:'太陽光パネル',secs:[['パネルとストリング','複数の太陽電池モジュールを直列接続したものがストリング。影や汚れ、セルのクラック、ホットスポット、バイパスダイオード不良などが発電量低下につながる。'],['PCS パワーコンディショナー','直流を交流へ変換し、MPPTや系統連系保護を担う。大型集中型と小型分散型があり、故障時の影響範囲、設置・保守性、コストが異なる。'],['直流側の点検','MC4コネクタ、PVケーブル、接続箱、直流ブレーカーを確認する。直流はアークが継続しやすいため、接続不良や極性、開放操作に注意が必要。'],['絶縁抵抗と耐圧試験','PV用メガーでは発電中の直流電圧を考慮して測定する。高圧の太陽電池回路では規定の絶縁耐力試験が必要になる場合があり、PCSを試験電圧から切り離して実施する。'],['保護と系統連系','PCSには過電流、直流地絡、直流分検出などの保護機能がある。電圧上昇抑制、力率一定制御、RPR・OVGRなど系統側保護との関係も含めて見る。'],['故障診断','IVカーブ、ストリングトレーサ、遠隔監視を使うと、発電量低下やストリング異常を絞り込みやすい。火災、腐食、獣害、ブレーカー入れ忘れなど、電気以外の要因も現場では多い。']],refs:[['太陽光パネル','panel'],['パネル開放電圧','panel-v'],['PVケーブル','pv_cable'],['絶縁抵抗測定','panel_ir'],['耐圧試験','pv_test'],['PCS','solar3'],['PCS保護機能','pcs_hogo'],['IVカーブ','iv'],['火災事故','pv_kasai']]}
};

const q=new URLSearchParams(location.search).get('c'),d=D[q],app=document.getElementById('app');
if(d){document.title=d.title+'｜AI memo labo';let h='<div class="k">CONSOLIDATED GUIDE · '+d.sub+'</div><h1>'+d.title+'</h1><p class="lead">'+d.lead+'</p><img src="'+d.img+'" alt="'+d.alt+'" loading="lazy"><p class="cap">画像：memo-labo.com の既存データを参照</p>';d.secs.forEach((s,i)=>h+='<h2>'+(i+1)+'. '+s[0]+'</h2><p>'+s[1]+'</p>');h+='<div class="note"><strong>注意：</strong>実際の施工・整定・試験では、設備仕様、メーカー資料、関係法令・規程、電力会社との協議内容を優先してください。</div><h2>元記事</h2><div class="sources">';d.refs.forEach(r=>h+='<a href="https://memo-labo.com/'+r[1]+'.php">'+r[0]+' ↗</a>');h+='</div>';app.innerHTML=h}else{const n=names[q]||'テーマガイド';document.title=n+'｜AI memo labo';app.innerHTML='<div class="k">EDITING</div><h1>'+n+'</h1><p class="lead">このテーマは元記事を読み込みながら統合編集中です。トップページの全45テーマ構造には組み込み済みで、順次OCR・PAS・接地・太陽光と同じ形式へ仕上げます。</p><div class="note">旧サイトの記事を単純に並べるのではなく、重複を整理し、基礎→仕組み→点検・試験→トラブルの流れで再編集します。</div>'}
