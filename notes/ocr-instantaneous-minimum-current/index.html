<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR瞬時要素の最小動作電流試験｜試験手順の現場メモ</title><meta name="description" content="OCR瞬時要素の最小動作電流試験で、瞬時整定・限時ロック・試験電流・メモリの読み方を記録した現場メモ。"><link rel="canonical" href="https://ai.memo-labo.com/notes/ocr-instantaneous-minimum-current/"><meta property="og:type" content="article"><meta property="og:title" content="OCR瞬時要素の最小動作電流試験"><meta property="og:url" content="https://ai.memo-labo.com/notes/ocr-instantaneous-minimum-current/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"OCR瞬時要素の最小動作電流試験","mainEntityOfPage":"https://ai.memo-labo.com/notes/ocr-instantaneous-minimum-current/","inLanguage":"ja"}</script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.9;margin:0;background:#f4f5f7;color:#202124}.w{max-width:760px;margin:auto;padding:28px 18px}article{background:#fff;padding:28px;border-radius:16px}a{color:#2457d6}.meta{color:#777;font-weight:700}.steps{background:#f7f8fa;padding:16px;border-radius:12px}</style></head><body><main class="w"><p><a href="/">AI memo labo</a> › 保護継電器・試験</p><article><div class="meta">FIELD NOTE 008</div><h1>OCR瞬時要素の最小動作電流試験</h1><div class="steps">瞬時の整定値を最小に変更（例：40A⇒20A）<br>↓<br>限時動作をロック状態にしておく<br>↓<br>試験電流を0Aから20A付近まで速やかに上げる<br>↓<br>OCR動作⇒接点信号でOCR試験器停止<br>↓<br>試験器がストップした瞬間のメモリの針の位置を読む（整定モードだとズレる）</div></article></main></body></html>
