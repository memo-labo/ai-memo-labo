<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GR＋LBSのトリップコイル絶縁抵抗・抵抗値の測定</title><meta name="description" content="GR＋LBSのトリップコイルについて、絶縁抵抗値と抵抗値を測定するときの現場手順を記録。"><link rel="canonical" href="https://ai.memo-labo.com/notes/gr-lbs-trip-coil/"><meta property="og:type" content="article"><meta property="og:title" content="GR＋LBSのトリップコイル絶縁抵抗・抵抗値の測定"><meta property="og:url" content="https://ai.memo-labo.com/notes/gr-lbs-trip-coil/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"GR＋LBSのトリップコイル絶縁抵抗・抵抗値の測定","mainEntityOfPage":"https://ai.memo-labo.com/notes/gr-lbs-trip-coil/","inLanguage":"ja"}</script><style>body{background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.9;color:#202124}.w{width:min(760px,calc(100% - 32px));margin:auto}.p{background:#fff;padding:30px;border-radius:16px;margin:40px 0}.steps{background:#f7f8fa;padding:16px;border-radius:12px}.danger{background:#fff4f2;padding:14px;border-radius:12px}img{max-width:100%;height:auto}a{color:#2457d6}</style></head><body><main class="w"><article class="p"><p><a href="/">AI memo labo</a></p><small>FIELD NOTE 013 / 保護継電器・試験</small><h1>GR＋LBSのトリップコイル絶縁抵抗・抵抗値の測定</h1><img src="/images/gr%2Blbs.png" alt="GR＋LBSのトリップコイル回路・測定箇所"><h2>絶縁抵抗値</h2><div class="steps">制御電源MCCBをOFF<br>↓<br>LBSにパレットスイッチがあればLBS投入<br>↓<br>GR本体の（C）またはP2で絶縁測定</div><h2>抵抗値</h2><div class="steps">制御電源MCCBをOFF<br>↓<br>LBSにパレットスイッチがあればLBS投入<br>↓<br>GR本体の（C）とP2間で抵抗測定</div><p class="danger">端子・回路構成は機種や現場配線で異なるため、現場の配線を確認してから測定する。</p></article></main></body></html>
