<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電験三種・電工・保安はどこに所属するかで待遇が違う｜現場経験</title><meta name="description" content="電験三種取得後の保安、電工、施工管理など、所属会社によって拘束時間や働き方が大きく違った実体験のメモ。"><link rel="canonical" href="https://ai.memo-labo.com/notes/electrical-career-company-choice/"><meta property="og:type" content="article"><meta property="og:title" content="どこに所属するかで待遇が全く違う"><meta property="og:url" content="https://ai.memo-labo.com/notes/electrical-career-company-choice/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"どこに所属するかで待遇が全く違う","mainEntityOfPage":"https://ai.memo-labo.com/notes/electrical-career-company-choice/","inLanguage":"ja"}</script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.9;margin:0;background:#f4f5f7;color:#202124}.w{max-width:760px;margin:auto;padding:28px 18px}article{background:#fff;padding:28px;border-radius:16px}a{color:#2457d6}.meta{color:#777;font-weight:700}.point{border-left:4px solid #2457d6;background:#f6f8ff;padding:12px 14px}</style></head><body><main class="w"><p><a href="/">AI memo labo</a> › 仕事・転職</p><article><div class="meta">FIELD NOTE 006</div><h1>どこに所属するかで待遇が全く違う</h1><p>電験三種に合格し、実務経験が積めても、その後どこに所属するかで待遇が全く違う。</p><p>例えば拘束時間。現場に直行直帰でOK、とりあえず一旦支社に来い、等。</p><p>電工もセコカンも保安も「どの会社を選ぶか」次第だが、肉体疲労と拘束時間が最も少ないのが保安。</p><div class="point">70過ぎのジジイだらけなのが良い証拠。</div></article></main></body></html>
