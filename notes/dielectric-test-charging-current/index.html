<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耐圧試験前に充電電流を把握する｜PAS・接地の確認</title><meta name="description" content="耐圧試験前に想定される充電電流を把握し、PAS単体など小電流時のレンジ選定や接地・接続確認につなげる現場メモ。"><link rel="canonical" href="https://ai.memo-labo.com/notes/dielectric-test-charging-current/"><meta property="og:type" content="article"><meta property="og:title" content="耐圧試験前に充電電流を把握する"><meta property="og:url" content="https://ai.memo-labo.com/notes/dielectric-test-charging-current/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"耐圧試験前に充電電流を把握する","mainEntityOfPage":"https://ai.memo-labo.com/notes/dielectric-test-charging-current/","inLanguage":"ja"}</script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.9;margin:0;background:#f4f5f7;color:#202124}.w{max-width:760px;margin:auto;padding:28px 18px}article{background:#fff;padding:28px;border-radius:16px}a{color:#2457d6}.meta{color:#777;font-weight:700}.point{border-left:4px solid #2457d6;background:#f6f8ff;padding:12px 14px}.danger{background:#fff4f2;padding:14px;border-radius:10px}</style></head><body><main class="w"><p><a href="/">AI memo labo</a> › 耐圧試験</p><article><div class="meta">FIELD NOTE 002</div><h1>耐圧試験前に充電電流を把握する</h1><p>耐圧試験前に、流れるはずの充電電流を把握しておく。</p><p>PAS単体なら数mA程度になることもある。試験器の電流計も、その電流が見えるレンジにする。</p><div class="danger">想定した充電電流が流れないなら、そのまま昇圧しない。接地・接続・試験回路を確認する。</div><p>充電電流は機器や試験条件で変わる。</p></article></main></body></html>
