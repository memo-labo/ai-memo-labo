<meta property="og:image" content="https://ai.memo-labo.com/images/profile.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://ai.memo-labo.com/images/profile.jpg"></head><body><main class="w"><article class="p"><p><a href="/">AI memo labo</a></p><small>FIELD NOTE 015 / 工具・便利アイテム</small><h1>高圧ケーブルのシールドアースのネジはナメやすい</h1><p>高圧ケーブルのシールドアースを接地に落とす部分のネジは、現場では真鍮製で、プラス3号のものが使われていることがある。</p><p>これをプラス2号のドライバーで緩めようとしたり、電動ドライバーで緩めようとすると、やり方によってはネジ頭をナメてしまう場合がある。</p><div class="point">ネジ頭に合ったプラス3号のドライバーを使い、特に固いネジを緩めるときはネジ頭を傷めないよう注意する。</div><div class="danger">ネジの材質・サイズは設備によって異なるため、実物を確認して適合する工具を使用する。</div></article><p><a href="/#note015">← 現場メモ一覧へ</a></p></main></body></html>
