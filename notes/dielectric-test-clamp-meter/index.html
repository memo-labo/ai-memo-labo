<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>単体耐圧はクランプで充電電流を見る｜PAS・UGS・VCB</title><meta name="description" content="PAS・UGS・VCBなどの単体耐圧で充電電流が小さい場合、微小電流対応クランプで補助確認する現場メモ。"><link rel="canonical" href="https://ai.memo-labo.com/notes/dielectric-test-clamp-meter/"><meta property="og:type" content="article"><meta property="og:title" content="単体耐圧はクランプで充電電流を見る"><meta property="og:url" content="https://ai.memo-labo.com/notes/dielectric-test-clamp-meter/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"単体耐圧はクランプで充電電流を見る","mainEntityOfPage":"https://ai.memo-labo.com/notes/dielectric-test-clamp-meter/","inLanguage":"ja"}</script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.9;margin:0;background:#f4f5f7;color:#202124}.w{max-width:760px;margin:auto;padding:28px 18px}article{background:#fff;padding:28px;border-radius:16px}a{color:#2457d6}.meta{color:#777;font-weight:700}.point{border-left:4px solid #2457d6;background:#f6f8ff;padding:12px 14px}</style><meta property="og:image" content="https://ai.memo-labo.com/images/profile.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://ai.memo-labo.com/images/profile.jpg"></head><body><main class="w"><p><a href="/">AI memo labo</a> › 耐圧試験</p><article><div class="meta">FIELD NOTE 001</div><h1>単体耐圧はクランプで充電電流を見る</h1><p>PAS、UGS、VCBなどを単体で耐圧すると、充電電流が小さい。</p><div class="point">試験器の電流計で見えにくい時は、微小電流を測れるクランプで確認する。</div><p>特にVCB単体は充電電流が非常に小さくなることがあり、試験器の電流計ではほとんど変化が見えないこともある。</p><p>クランプは分解能・レンジ・周波数特性を確認。補助的な確認として使う。</p></article></main></body></html>
