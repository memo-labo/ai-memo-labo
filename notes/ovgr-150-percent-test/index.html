<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OVGRの150%試験は印加電圧に注意｜零相電圧試験</title><meta name="description" content="OVGRの150%試験でT-Eへ印加する電圧、周波数、試験器レンジ、メーカー・機種差に注意する現場メモ。"><link rel="canonical" href="https://ai.memo-labo.com/notes/ovgr-150-percent-test/"><meta property="og:type" content="article"><meta property="og:title" content="OVGRの150%試験は印加電圧に注意"><meta property="og:url" content="https://ai.memo-labo.com/notes/ovgr-150-percent-test/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"OVGRの150%試験は印加電圧に注意","mainEntityOfPage":"https://ai.memo-labo.com/notes/ovgr-150-percent-test/","inLanguage":"ja"}</script><style>body{background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.9;color:#202124}.w{width:min(760px,calc(100% - 32px));margin:auto}.p{background:#fff;padding:30px;border-radius:16px;margin:40px 0}.point{border-left:4px solid #2457d6;background:#f6f8ff;padding:12px}.danger{background:#fff4f2;padding:14px;border-radius:12px}a{color:#2457d6}</style><meta property="og:image" content="https://ai.memo-labo.com/images/profile.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://ai.memo-labo.com/images/profile.jpg"></head><body><main class="w"><article class="p"><p><a href="/">AI memo labo</a></p><small>FIELD NOTE 010 / 保護継電器・試験</small><h1>OVGRの150%試験は印加電圧に注意</h1><p>整定値10%でT-Eの動作電圧が約381Vなら、150%試験は約571V（381V×1.5）。普段あまり使わない高い試験電圧なので注意。</p><div class="point">試験前に確認：①50Hz／60Hz ②試験器のレンジ・ツマミ ③ZPDのT-Eに印加する電圧</div><div class="danger">T-Eの試験電圧はメーカー・機種で異なる。特に三菱製は他社と同じ電圧を掛けない。取扱説明書・試験要領を確認する。</div></article></main></body></html>
