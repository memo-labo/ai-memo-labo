name: Sync shared ads across all articles

on:
  push:
    branches: [main]
    paths:
      - '_shared/adsense.html'
      - '_shared/amazon-random.js'
      - 'amazon-random.js'
      - 'index.html'
      - 'notes/**/index.html'
      - '.github/workflows/sync-adsense.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync AdSense and Amazon ads into all articles
        shell: python
        run: |
          from pathlib import Path
          import re

          snippet = Path('_shared/adsense.html').read_text(encoding='utf-8').strip()
          begin = '<!-- adsense:begin -->'
          end = '<!-- adsense:end -->'
          pattern = re.compile(re.escape(begin) + r'.*?' + re.escape(end), re.S)

          pages = [Path('index.html'), *sorted(Path('notes').glob('*/index.html'))]
          changed = []
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if pattern.search(text):
                  updated = pattern.sub(snippet, text, count=1)
              else:
                  if '</head>' not in text:
                      raise SystemExit(f'missing </head>: {page}')
                  updated = text.replace('</head>', snippet + '\n</head>', 1)
              # Every existing and future article loads the same random Amazon ad script.
              if page.parts[0] == 'notes':
                  amazon_tag = '<script defer src="/amazon-random.js"></script>'
                  updated = updated.replace('<script defer src="/_shared/amazon-random.js"></script>', amazon_tag)
                  if amazon_tag not in updated:
                      if '</body>' not in updated:
                          raise SystemExit(f'missing </body>: {page}')
                      updated = updated.replace('</body>', amazon_tag + '</body>', 1)
              if updated != text:
                  page.write_text(updated, encoding='utf-8')
                  changed.append(str(page))
          print(f'Updated {len(changed)} page(s)')
          for page in changed:
              print(page)
      - name: Commit synchronized pages
        run: |
          if git diff --quiet; then
            echo 'Shared ads already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html notes
          git commit -m 'Sync shared AdSense and Amazon ads'
          git push
