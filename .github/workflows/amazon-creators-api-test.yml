name: Amazon Creators API Product Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amazon-creators-api-test.yml'

permissions:
  contents: write

jobs:
  refresh-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Amazon product cards
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_VERSION }}
          PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID"; test -n "$CLIENT_SECRET"; test -n "$CREDENTIAL_VERSION"; test -n "$PARTNER_TAG"
          VERSION="$(printf '%s' "$CREDENTIAL_VERSION" | tr -d '[:space:]')"
          case "$VERSION" in
            3.1) TOKEN_ENDPOINT="https://api.amazon.com/auth/o2/token" ;;
            3.2) TOKEN_ENDPOINT="https://api.amazon.co.uk/auth/o2/token" ;;
            3.3) TOKEN_ENDPOINT="https://api.amazon.co.jp/auth/o2/token" ;;
            *) echo 'Unsupported credential version'; exit 1 ;;
          esac
          TOKEN_BODY="$(mktemp)"
          STATUS=$(curl -sS -o "$TOKEN_BODY" -w '%{http_code}' -X POST "$TOKEN_ENDPOINT" -H 'Content-Type: application/json' -d "$(jq -nc --arg a "$CLIENT_ID" --arg b "$CLIENT_SECRET" '{grant_type:"client_credentials",client_id:$a,client_secret:$b,scope:"creatorsapi::default"}')")
          [ "$STATUS" = 200 ] || { echo "OAuth failed HTTP $STATUS"; exit 1; }
          ACCESS_TOKEN=$(jq -r '.access_token // empty' "$TOKEN_BODY")
          test -n "$ACCESS_TOKEN"

          python3 - <<'PY'
          import glob,re,subprocess,os,json,urllib.request
          token=os.environ['ACCESS_TOKEN'] if 'ACCESS_TOKEN' in os.environ else ''
          PY

          export ACCESS_TOKEN
          python3 - <<'PY'
          import glob,re,subprocess,os,json,urllib.request
          token=os.environ['ACCESS_TOKEN']; tag=os.environ['PARTNER_TAG']
          for path in glob.glob('notes/**/*.html', recursive=True):
              text=open(path,encoding='utf-8').read()
              urls=re.findall(r'https://link\.amazon/[A-Za-z0-9]+',text)
              for short in dict.fromkeys(urls):
                  p=subprocess.run(['curl','-sS','-L','-o','/dev/null','-w','%{url_effective}',short],capture_output=True,text=True,check=True)
                  final=p.stdout.strip()
                  m=re.search(r'/(?:dp|gp/product)/([A-Z0-9]{10})(?:[/?]|$)',final,re.I)
                  if not m:
                      print('Could not resolve ASIN for',short); continue
                  asin=m.group(1).upper()
                  body=json.dumps({'itemIds':[asin],'itemIdType':'ASIN','marketplace':'www.amazon.co.jp','partnerTag':tag,'resources':['images.primary.medium','itemInfo.title']}).encode()
                  req=urllib.request.Request('https://creatorsapi.amazon/catalog/v1/getItems',data=body,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','x-marketplace':'www.amazon.co.jp'},method='POST')
                  with urllib.request.urlopen(req) as r: data=json.load(r)
                  items=(data.get('itemResults') or data.get('itemsResult') or {}).get('items',[])
                  if not items: print('No item for',asin); continue
                  item=items[0]
                  title=item.get('itemInfo',{}).get('title',{}).get('displayValue','Amazon商品')
                  image=item.get('images',{}).get('primary',{}).get('medium',{}).get('url','')
                  if not image: print('No image for',asin); continue
                  esc=lambda s:s.replace('&','&amp;').replace('"','&quot;').replace('<','&lt;').replace('>','&gt;')
                  card=f'<div class="amazon-api-product"><a href="{short}" target="_blank" rel="nofollow sponsored noopener"><img src="{image}" alt="{esc(title)}" loading="lazy"></a><div><strong>{esc(title)}</strong><br><a href="{short}" target="_blank" rel="nofollow sponsored noopener">Amazonで見る</a></div></div>'
                  # Upgrade simple product boxes containing this short link; leave already upgraded cards alone.
                  if 'amazon-api-product' not in text or short not in re.findall(r'<div class="amazon-api-product">.*?</div></div>',text,re.S):
                      pattern=r'<div class="product">(?:(?!</div>).)*?href="'+re.escape(short)+r'"(?:(?!</div>).)*?</div>'
                      text,n=re.subn(pattern,card,text,count=1,flags=re.S)
                      if n==0 and short in text and image not in text:
                          # Add image immediately before the existing Amazon link when markup differs.
                          text=text.replace(f'<a href="{short}"',f'<img class="amazon-api-image" src="{image}" alt="{esc(title)}" loading="lazy"><br><a href="{short}"',1)
                  style='.amazon-api-product{display:flex;gap:18px;align-items:center;background:#fff8e8;border:1px solid #ead8a7;border-radius:12px;padding:16px;margin:20px 0}.amazon-api-product img,.amazon-api-image{width:160px;max-width:42%;height:auto;border-radius:8px;background:#fff}'
                  if '.amazon-api-product{' not in text:
                      text=text.replace('</style>',style+'</style>',1)
              open(path,'w',encoding='utf-8').write(text)
          PY

      - name: Commit refreshed product cards
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No product card changes.'; exit 0; fi
          git config user.name 'memo-labo'
          git config user.email 'denkimemo713@gmail.com'
          git add notes
          git commit -m 'Refresh Amazon product cards via Creators API'
          git push
