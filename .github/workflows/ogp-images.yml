name: Set OGP images

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'images/**'
      - '.github/workflows/ogp-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ogp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set article OGP images
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin, quote
          import re

          SITE = 'https://ai.memo-labo.com/'
          FALLBACK = SITE + 'images/profile.jpg'

          class FirstArticleImage(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_article = 0
                  self.src = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'article':
                      self.in_article += 1
                  elif tag == 'img' and self.in_article and not self.src:
                      self.src = attrs.get('src')
              def handle_endtag(self, tag):
                  if tag == 'article' and self.in_article:
                      self.in_article -= 1

          def absolute_image(src):
              if not src:
                  return FALLBACK
              if src.startswith(('http://', 'https://')):
                  return src
              # Preserve URL path separators while safely encoding spaces/+ etc.
              path = quote(src, safe='/%:@?=&%')
              return urljoin(SITE, path)

          for page in Path('notes').glob('*/index.html'):
              text = page.read_text(encoding='utf-8')
              parser = FirstArticleImage()
              parser.feed(text)
              image = absolute_image(parser.src)

              tags = (
                  f'<meta property="og:image" content="{image}">'
                  f'<meta name="twitter:card" content="summary_large_image">'
                  f'<meta name="twitter:image" content="{image}">'
              )

              # Replace existing image/card tags so reruns stay idempotent.
              cleaned = re.sub(r'<meta\s+(?:property|name)="(?:og:image|twitter:image|twitter:card)"[^>]*>', '', text, flags=re.I)
              if '</head>' not in cleaned:
                  continue
              updated = cleaned.replace('</head>', tags + '</head>', 1)
              if updated != text:
                  page.write_text(updated, encoding='utf-8')
      - name: Commit generated OGP metadata
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes
          git commit -m "Update article OGP images"
          git push
