name: SEO internal links
on:
  push:
    paths:
      - '.github/workflows/seo-internal-links.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage links to existing article URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          fixes={
            '/notes/single-withstand-clamp/':'/notes/dielectric-test-clamp-meter/',
            '/notes/withstand-charging-current/':'/notes/dielectric-test-charging-current/',
            '/notes/career-position-talk/':'/notes/electrical-career-position-talk/',
            '/notes/electrician-vs-maintenance-culture/':'/notes/electrician-vs-electrical-safety/',
            '/notes/aerial-work-platform-first-day/':'/notes/aerial-work-platform-apprentice/',
            '/notes/site-building-github-chatgpt/':'/notes/how-ai-memo-labo-is-built/',
          }
          for old,new in fixes.items():
              if old not in s:
                  raise SystemExit(f'missing expected old URL: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'memo-labo'
          git config user.email 'denkimemo713@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix broken SEO article links'
          git push
